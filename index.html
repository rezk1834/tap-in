<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tap In</title>
    <meta name="description" content="قرّب هاتفك من بطاقة Tap In لفتح المنيو والسوشيال ميديا والتقييمات والعروض." />
    <meta name="color-scheme" content="light dark" />
    <script>try{
      var d=document.documentElement,s=localStorage;
      var t=s.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.dataset.theme=t;
      // Arabic is the default language; an English choice is remembered. The dashboard is always English / left-to-right.
      var l=s.getItem("lang")==="en"?"en":"ar";if(location.pathname.indexOf("/admin")===0)l="en";
      d.lang=l;d.dir=l==="ar"?"rtl":"ltr";
      var z=[0.85,1,1.15,1.3,1.5][Number(s.getItem("fs"))];if(z)d.style.setProperty("--fs",z);
    }catch(e){}</script>
    <link rel="icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- default fonts (Cairo for Arabic, Inter for Latin). Other fonts chosen in the dashboard are loaded on demand. -->
    <link rel="stylesheet" data-font="Cairo" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" />
    <link rel="stylesheet" data-font="Inter" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
